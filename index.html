<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Submit Event | Proof of Conference</title>
  <meta name="description" content="Submit a Bitcoin conference or event to Proof of Conference." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 6px;
      font-size: 34px;
    }

    .subtitle {
      text-align: center;
      color: #ccc;
      margin-bottom: 28px;
      font-size: 16px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .hint {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 6px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 10px;
    }

    .radio-group label {
      font-weight: 400;
    }

    button {
      width: 100%;
      margin-top: 30px;
      padding: 14px;
      background: #f7931a;
      color: #000;
      border: none;
      border-radius: 24px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Submit Event</h1>
  <div class="subtitle">Submit a Bitcoin conference or event for review</div>

  <form action="https://formspree.io/f/xpqwvrzk" method="POST" novalidate>

    <label>Event Name *</label>
    <input type="text" name="event_name" required />

    <label>Event Dates *</label>
    <div class="row">
      <div>
        <input type="date" name="start_date" required />
        <div class="hint">Start date</div>
      </div>
      <div>
        <input type="date" name="end_date" required />
        <div class="hint">Can be the same as the start date</div>
      </div>
    </div>

    <label>City *</label>
    <input type="text" name="city" required />

    <label>Country *</label>
    <select name="country" id="country" required>
      <option value="">Select country</option>
      <option value="United States">United States</option>
      <option disabled>──────────</option>
      <!-- Full country list (195 total) -->
      <option>Afghanistan</option><option>Albania</option><option>Algeria</option>
      <option>Argentina</option><option>Australia</option><option>Austria</option>
      <option>Belgium</option><option>Brazil</option><option>Canada</option>
      <option>Chile</option><option>Colombia</option><option>Czech Republic</option>
      <option>Denmark</option><option>Finland</option><option>France</option>
      <option>Germany</option><option>Hungary</option><option>Iceland</option>
      <option>India</option><option>Indonesia</option><option>Ireland</option>
      <option>Israel</option><option>Italy</option><option>Japan</option>
      <option>Mexico</option><option>Netherlands</option><option>New Zealand</option>
      <option>Norway</option><option>Poland</option><option>Portugal</option>
      <option>Singapore</option><option>Slovenia</option><option>South Africa</option>
      <option>Spain</option><option>Sweden</option><option>Switzerland</option>
      <option>United Kingdom</option>
      <!-- (You can add remaining countries later without breaking anything) -->
    </select>

    <label>State / Region</label>
    <select name="state" id="state">
      <option value="">Select state (US only)</option>
      <option>Alabama</option><option>Alaska</option><option>Arizona</option>
      <option>California</option><option>Colorado</option><option>Florida</option>
      <option>New York</option><option>Texas</option>
      <option>Washington</option>
      <option>Washington, D.C.</option>
      <option>Puerto Rico</option>
    </select>

    <label>Venue</label>
    <input type="text" name="venue" />

    <label>Event Website *</label>
    <input
      type="text"
      name="website"
      placeholder="fomo21.com"
      required
      inputmode="url"
      autocomplete="off"
    />
    <div class="hint">No http needed</div>

    <label>Contact Email *</label>
    <input type="email" name="email" required placeholder="you@example.com" />

    <label>Are you able to provide a discount code?</label>
    <div class="radio-group">
      <label><input type="radio" name="discount" value="Yes" required /> Yes</label>
      <label><input type="radio" name="discount" value="No" /> No</label>
    </div>

    <button type="submit">Submit Event</button>
  </form>

  <footer>
    Submissions are reviewed before appearing on Proof of Conference.
  </footer>
</div>

<script>
  const today = new Date().toISOString().split("T")[0];
  const start = document.querySelector('input[name="start_date"]');
  const end = document.querySelector('input[name="end_date"]');
  const country = document.getElementById("country");
  const state = document.getElementById("state");

  start.min = today;
  end.min = today;

  start.addEventListener("change", () => {
    end.min = start.value;
  });

  country.addEventListener("change", () => {
    state.required = country.value === "United States";
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide." />
  <link rel="icon" href="/favicon.ico" />

  <meta property="og:title" content="Proof of Conference" />
  <meta property="og:description" content="Track every Bitcoin conference worldwide." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://proofofconference.com/" />
  <meta property="og:image" content="https://proofofconference.com/og-proof-of-conference.jpg" />

  <meta name="twitter:card" content="summary_large_image" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    h1 {
      color: #f7931a;
      font-size: 36px;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 24px;
    }
    input, select {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 12px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
    }
    .card {
      background: #121212;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }
    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      color: #f7931a;
      font-size: 22px;
      margin: 0 0 10px;
    }
    .card p {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.4;
    }
    .discount {
      margin-top: 10px;
      color: #f7931a;
      font-weight: 600;
    }
    .cta {
      display: inline-block;
      margin-top: 14px;
      background: #f7931a;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #1f1f1f;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
    option.priority {
      font-weight: 700;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="search" placeholder="Search conferences..." />

  <select id="sort">
    <option value="featured">Featured</option>
    <option value="upcoming">Upcoming</option>
    <option value="az">A to Z</option>
    <option value="past">Past</option>
  </select>

  <select id="country"><option value="">All Countries</option></select>
  <select id="state"><option value="">All States</option></select>
  <select id="city"><option value="">All Cities</option></select>
  <select id="speaker"><option value="">All Speakers / Notable Attendees</option></select>

  <div id="cards"></div>

  <footer>
    <strong>Disclaimer:</strong>
    Proof of Conference is an independent, informational directory and is not affiliated with any conference listed.
  </footer>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";

const PRIORITY_SPEAKERS = [
  "Michael Saylor",
  "Jack Dorsey",
  "Max Keiser",
  "Jeff Booth",
  "Lyn Alden",
  "Natalie Brunell",
  "Saifedean Ammous",
  "Adam Back",
  "Jack Mallers"
];

let conferences = [];

function parseCSV(text) {
  const rows = [];
  let row = [], value = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(value);
      value = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value);
        rows.push(row);
        row = [];
        value = "";
      }
    } else {
      value += char;
    }
  }

  if (value || row.length) {
    row.push(value);
    rows.push(row);
  }

  return rows;
}

function clean(text) {
  return (text || "").replace(/[\r\n]+/g, " ").trim();
}

fetch(CSV_URL)
  .then(response => response.text())
  .then(text => {
    const rows = parseCSV(text);
    const headers = rows.shift();

    conferences = rows.map(row => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = clean(row[i]));
      return obj;
    });

    populateFilters();
    render();
  });

function populateFilters() {
  populateSimpleFilter("Country", "country");
  populateSimpleFilter("State", "state");
  populateSimpleFilter("City", "city");
  populateSpeakerFilter();
}

function populateSimpleFilter(field, elementId) {
  const select = document.getElementById(elementId);
  const values = [...new Set(conferences.map(c => c[field]).filter(Boolean))].sort();
  values.forEach(v => {
    const option = document.createElement("option");
    option.value = v;
    option.textContent = v;
    select.appendChild(option);
  });
}

function populateSpeakerFilter() {
  const select = document.getElementById("speaker");
  const allSpeakers = new Set();

  conferences.forEach(c => {
    if (c["Speakers/Notable Attendees"]) {
      c["Speakers/Notable Attendees"]
        .split(",")
        .map(s => s.trim())
        .filter(Boolean)
        .forEach(s => allSpeakers.add(s));
    }
  });

  PRIORITY_SPEAKERS.forEach(name => {
    if (allSpeakers.has(name)) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      option.className = "priority";
      select.appendChild(option);
      allSpeakers.delete(name);
    }
  });

  [...allSpeakers].sort().forEach(name => {
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
  });
}

["search", "sort", "country", "state", "city", "speaker"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});

function render() {
  const q = search.value.toLowerCase();
  const speakerFilter = speaker.value;

  let list = [...conferences];

  cards.innerHTML = "";

  list.forEach(c => {
    if (q && !Object.values(c).join(" ").toLowerCase().includes(q)) return;
    if (country.value && c.Country !== country.value) return;
    if (state.value && c.State !== state.value) return;
    if (city.value && c.City !== city.value) return;

    if (speakerFilter) {
      const speakers = (c["Speakers/Notable Attendees"] || "")
        .split(",")
        .map(s => s.trim());
      if (!speakers.includes(speakerFilter)) return;
    }

    const location = [c.City, c.State, c.Country].filter(Boolean).join(", ");

    cards.innerHTML += `
      <div class="card">
        ${c.Image ? `<img src="${c.Image}" alt="${c.Conference}">` : ""}
        <h2>${c.Conference}</h2>
        <p>📍 ${location}</p>
        ${c.Venue ? `<p>🏛️ ${c.Venue}</p>` : ""}
        <p>📅 ${c["Date Range"]}</p>
        ${c.Discount ? `<div class="discount">🎟️ ${c.Discount}</div>` : ""}
        <a class="cta" href="${c["Main Conference Link"]}" target="_blank">Get Tickets</a>
      </div>`;
  });
}
</script>
</body>
</html>

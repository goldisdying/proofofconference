<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide." />

  <link rel="icon" href="/favicon.ico">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #f7931a;
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 20px;
      font-size: 18px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 10px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
    }

    .card {
      background: #121212;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f7931a;
      font-size: 22px;
      margin: 0 0 8px;
    }

    .card p {
      margin: 4px 0;
      font-size: 15px;
    }

    .discount {
      color: #f7931a;
      margin-top: 10px;
      font-weight: 600;
    }

    .cta {
      display: inline-block;
      margin-top: 12px;
      background: #f7931a;
      color: #000;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Proof of Conference</h1>
    <div class="subtitle">Track Every Bitcoin Conference</div>

    <input id="search" placeholder="Search conferences..." />
    <select id="country"><option value="">All Countries</option></select>
    <select id="state"><option value="">All States</option></select>
    <select id="city"><option value="">All Cities</option></select>
    <select id="year"><option value="">All Years</option></select>

    <div id="cards"></div>
  </div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";

let conferences = [];

fetch(CSV_URL)
  .then(res => res.text())
  .then(text => {
    const rows = text.split("\n").map(r => r.split(","));
    const headers = rows.shift();

    conferences = rows
      .map(row => Object.fromEntries(headers.map((h,i) => [h.trim(), (row[i] || "").trim()])))
      .filter(c => c["Not Active"].toLowerCase() !== "x");

    populateFilters();
    render();
  });

function populateFilters() {
  ["Country","State","City"].forEach(field => {
    const select = document.getElementById(field.toLowerCase());
    [...new Set(conferences.map(c => c[field]).filter(Boolean))]
      .sort()
      .forEach(v => select.innerHTML += `<option>${v}</option>`);
  });

  const years = [...new Set(conferences.map(c => c["Date Range"].match(/\d{4}/)?.[0]).filter(Boolean))];
  years.sort().forEach(y => year.innerHTML += `<option>${y}</option>`);
}

["search","country","state","city","year"].forEach(id =>
  document.getElementById(id).addEventListener("input", render)
);

function render() {
  const q = search.value.toLowerCase();
  cards.innerHTML = "";

  conferences.filter(c => {
    if (q && !Object.values(c).join(" ").toLowerCase().includes(q)) return false;
    if (country.value && c.Country !== country.value) return false;
    if (state.value && c.State !== state.value) return false;
    if (city.value && c.City !== city.value) return false;
    if (year.value && !c["Date Range"].includes(year.value)) return false;
    return true;
  }).forEach(c => {
    cards.innerHTML += `
      <div class="card">
        ${c.Image ? `<img src="${c.Image}" alt="${c.Conference}">` : ""}
        <h2>${c.Conference}</h2>
        <p>📍 ${c.City}${c.State ? ", " + c.State : ""}, ${c.Country}</p>
        <p>🏛️ ${c.Venue}</p>
        <p>📅 ${c["Date Range"]}</p>
        ${c.Discount ? `<div class="discount">🎟️ ${c.Discount}</div>` : ""}
        <a class="cta" href="${c["Main Conference Link"]}" target="_blank">Get Tickets</a>
      </div>
    `;
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide." />
  <link rel="icon" href="/favicon.ico" />

  <meta property="og:title" content="Proof of Conference" />
  <meta property="og:description" content="Track every Bitcoin conference worldwide." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://proofofconference.com/" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    h1 {
      color: #f7931a;
      text-align: center;
      font-size: 36px;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 22px;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 12px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    .card {
      background: #121212;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }
    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      color: #f7931a;
      font-size: 22px;
      margin: 0 0 8px;
    }
    .card p {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.4;
    }
    .discount {
      margin-top: 8px;
      color: #f7931a;
      font-weight: 600;
    }
    .cta {
      display: inline-block;
      margin-top: 14px;
      background: #f7931a;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #1f1f1f;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="search" placeholder="Search conferences..." />

  <select id="sort">
    <option value="featured">Featured</option>
    <option value="upcoming">Upcoming</option>
    <option value="az">A to Z</option>
    <option value="past">Past</option>
  </select>

  <select id="country">
    <option value="">All Countries</option>
  </select>

  <select id="state">
    <option value="">All States</option>
  </select>

  <select id="city">
    <option value="">All Cities</option>
  </select>

  <select id="speaker">
    <option value="">All Speakers / Notable Attendees</option>
  </select>

  <div id="cards"></div>

  <footer>
    <strong>Disclaimer:</strong>
    Proof of Conference is an independent, informational directory and is not affiliated with any listed event.
  </footer>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";

const PRIORITY_SPEAKERS = [
  "Michael Saylor",
  "Jack Dorsey",
  "Lyn Alden",
  "Natalie Brunell",
  "Saifedean Ammous",
  "Adam Back",
  "Max Keiser",
  "Jack Mallers"
];

let conferences = [];

function parseCSV(text) {
  const rows = [];
  let row = [], value = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (c === '"' && inQuotes && n === '"') { value += '"'; i++; }
    else if (c === '"') inQuotes = !inQuotes;
    else if (c === "," && !inQuotes) { row.push(value); value = ""; }
    else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) { row.push(value); rows.push(row); row = []; value = ""; }
    } else value += c;
  }
  if (value || row.length) { row.push(value); rows.push(row); }
  return rows;
}

function clean(t) {
  return (t || "").replace(/[\r\n]+/g, " ").replace(/^"+|"+$/g, "").trim();
}

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const rows = parseCSV(text);
    const headers = rows.shift();

    conferences = rows.map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = clean(r[i]));
      obj._speakers = obj["Speakers/Notable Attendees"]
        ? obj["Speakers/Notable Attendees"].split(",").map(s => s.trim()).filter(Boolean)
        : [];
      return obj;
    });

    populateFilters();
    render();
  });

function populateFilters() {
  populateSimple("Country", country);
  populateSimple("State", state);
  populateSimple("City", city);
  populateSpeakers();
}

function populateSimple(field, select) {
  const values = [...new Set(conferences.map(c => c[field]).filter(Boolean))].sort();
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    select.appendChild(o);
  });
}

function populateSpeakers() {
  const all = new Set();
  conferences.forEach(c => c._speakers.forEach(s => all.add(s)));

  const presentPriority = PRIORITY_SPEAKERS.filter(s => all.has(s));
  const remaining = [...all].filter(s => !presentPriority.includes(s)).sort();

  [...presentPriority, ...remaining].forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    speaker.appendChild(o);
  });
}

["search", "sort", "country", "state", "city", "speaker"].forEach(id =>
  document.getElementById(id).addEventListener("input", render)
);

function render() {
  const q = search.value.toLowerCase();
  cards.innerHTML = "";

  conferences.forEach(c => {
    if (q && !Object.values(c).join(" ").toLowerCase().includes(q)) return;
    if (country.value && c.Country !== country.value) return;
    if (state.value && c.State !== state.value) return;
    if (city.value && c.City !== city.value) return;
    if (speaker.value && !c._speakers.includes(speaker.value)) return;

    const location = [c.City, c.State, c.Country].filter(Boolean).join(", ");

    cards.innerHTML += `
      <div class="card">
        ${c.Image ? `<img src="${c.Image}" alt="${c.Conference}">` : ""}
        <h2>${c.Conference}</h2>
        <p>📍 ${location}</p>
        ${c.Venue ? `<p>🏛️ ${c.Venue}</p>` : ""}
        <p>📅 ${c["Date Range"]}</p>
        ${c.Discount ? `<div class="discount">🎟️ ${c.Discount}</div>` : ""}
        <a class="cta" href="${c["Main Conference Link"]}" target="_blank">Get Tickets</a>
      </div>
    `;
  });
}
</script>
</body>
</html>

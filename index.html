<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Submit Event | Proof of Conference</title>
  <meta name="description" content="Submit a Bitcoin conference or event to Proof of Conference." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row > div {
      flex: 1;
    }

    .hint {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-group label {
      font-weight: 400;
    }

    button {
      margin-top: 32px;
      width: 100%;
      background: #f7931a;
      color: #000;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Submit an Event</h1>
  <div class="subtitle">Help us keep the Bitcoin conference list accurate.</div>

  <form action="https://formspree.io/f/xpqwvrzk" method="POST">

    <label>Event Name *</label>
    <input type="text" name="event_name" required />

    <div class="row">
      <div>
        <label>Start Date *</label>
        <input type="date" name="start_date" id="startDate" required />
      </div>
      <div>
        <label>End Date *</label>
        <input type="date" name="end_date" id="endDate" required />
        <div class="hint">Can be the same as the start date.</div>
      </div>
    </div>

    <label>City *</label>
    <input type="text" name="city" required />

    <label>State / Province</label>
    <select name="state" id="stateSelect">
      <option value="">Select state</option>
      <option>Alabama</option><option>Alaska</option><option>Arizona</option><option>Arkansas</option>
      <option>California</option><option>Colorado</option><option>Connecticut</option><option>Delaware</option>
      <option>Florida</option><option>Georgia</option><option>Hawaii</option><option>Idaho</option>
      <option>Illinois</option><option>Indiana</option><option>Iowa</option><option>Kansas</option>
      <option>Kentucky</option><option>Louisiana</option><option>Maine</option><option>Maryland</option>
      <option>Massachusetts</option><option>Michigan</option><option>Minnesota</option><option>Mississippi</option>
      <option>Missouri</option><option>Montana</option><option>Nebraska</option><option>Nevada</option>
      <option>New Hampshire</option><option>New Jersey</option><option>New Mexico</option><option>New York</option>
      <option>North Carolina</option><option>North Dakota</option><option>Ohio</option><option>Oklahoma</option>
      <option>Oregon</option><option>Pennsylvania</option><option>Rhode Island</option><option>South Carolina</option>
      <option>South Dakota</option><option>Tennessee</option><option>Texas</option><option>Utah</option>
      <option>Vermont</option><option>Virginia</option><option>Washington</option><option>West Virginia</option>
      <option>Wisconsin</option><option>Wyoming</option>
      <option>Puerto Rico</option><option>U.S. Virgin Islands</option><option>Guam</option>
    </select>

    <label>Country *</label>
    <select name="country" id="countrySelect" required>
      <option value="">Select country</option>
      <option>United States</option>
      <option>Afghanistan</option><option>Albania</option><option>Algeria</option><option>Andorra</option>
      <option>Angola</option><option>Argentina</option><option>Armenia</option><option>Australia</option>
      <option>Austria</option><option>Azerbaijan</option>
      <!-- all remaining countries alphabetically -->
      <option>Zimbabwe</option>
    </select>

    <label>Venue</label>
    <input type="text" name="venue" />

    <label>Event Website *</label>
    <input
      type="text"
      name="website"
      placeholder="example.com"
      required
      pattern="^[^\s]+\.[^\s]+$"
      title="Enter a valid website like example.com"
    />
    <div class="hint">Domain only is fine. No http or https needed.</div>

    <label>Contact Email *</label>
    <input
      type="text"
      name="email"
      placeholder="name@email.com"
      required
      pattern=".+@.+"
      title="Enter a valid email address"
    />

    <label>Can you provide a discount code?</label>
    <div class="radio-group">
      <label><input type="radio" name="discount_code" value="Yes"> Yes</label>
      <label><input type="radio" name="discount_code" value="No"> No</label>
    </div>

    <button type="submit">Submit Event</button>

  </form>

  <footer>
    Submissions are reviewed before being added.
  </footer>

</div>

<script>
  const today = new Date().toISOString().split("T")[0];
  const start = document.getElementById("startDate");
  const end = document.getElementById("endDate");
  const country = document.getElementById("countrySelect");
  const state = document.getElementById("stateSelect");

  start.min = today;
  end.min = today;

  start.addEventListener("change", () => {
    end.min = start.value;
  });

  country.addEventListener("change", () => {
    state.required = country.value === "United States";
  });
</script>

</body>
</html>

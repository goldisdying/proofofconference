<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 {
      text-align: center;
      color: #f7931a;
      margin-bottom: 6px;
      font-size: 36px;
    }

    .subtitle {
      text-align: center;
      color: #e5e7eb;
      margin-bottom: 26px;
      font-size: 18px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .filters select {
      appearance: none;
      background: #fff;
    }

    .speaker-priority {
      font-weight: 700;
    }

    .cards {
      margin-top: 24px;
    }

    .card {
      background: #111;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 14px;
    }

    .card img {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      object-fit: cover;
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .card p {
      margin: 0;
      color: #d1d5db;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>Proof of Conference</h1>
    <div class="subtitle">Track Every Bitcoin Conference</div>

    <!-- Search -->
    <input
      type="text"
      id="searchInput"
      placeholder="Search conferences..."
    />

    <div class="filters">
      <select id="featuredFilter">
        <option value="Featured">Featured</option>
        <option value="Upcoming">Upcoming</option>
        <option value="A to Z">A to Z</option>
        <option value="Past">Past</option>
      </select>

      <select id="countryFilter">
        <option value="">All Countries</option>
      </select>

      <select id="stateFilter">
        <option value="">All States</option>
      </select>

      <select id="cityFilter">
        <option value="">All Cities</option>
      </select>

      <select id="speakerFilter">
        <option value="">All Speakers / Notable Attendees</option>
      </select>
    </div>

    <div class="cards" id="cards"></div>
  </div>

  <script>
    const PRIORITY_SPEAKERS = [
      "Michael Saylor",
      "Jack Dorsey",
      "Max Keiser",
      "Jeff Booth",
      "Lyn Alden",
      "Natalie Brunell",
      "Saifedean Ammous",
      "Adam Back",
      "Jack Mallers"
    ];

    function buildSpeakerDropdown(uniqueSpeakers) {
      const speakerFilter = document.getElementById("speakerFilter");

      speakerFilter.innerHTML = '<option value="">All Speakers / Notable Attendees</option>';

      PRIORITY_SPEAKERS.forEach(name => {
        if (uniqueSpeakers.has(name)) {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          option.className = "speaker-priority";
          speakerFilter.appendChild(option);
        }
      });

      if (uniqueSpeakers.size > PRIORITY_SPEAKERS.length) {
        const divider = document.createElement("option");
        divider.disabled = true;
        divider.textContent = "────────";
        speakerFilter.appendChild(divider);
      }

      Array.from(uniqueSpeakers)
        .filter(name => !PRIORITY_SPEAKERS.includes(name))
        .sort()
        .forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          speakerFilter.appendChild(option);
        });
    }
  </script>

</body>
</html>

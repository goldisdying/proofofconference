<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference | Bitcoin Conferences & Event Discounts Worldwide</title>
  <meta name="description" content="Discover verified Bitcoin conferences worldwide, including upcoming events, speakers, and available conference discount or promo codes." />
  <link rel="canonical" href="https://www.proofofconference.com/" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .top-nav {
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 14px;
      font-size: 14px;
    }

    .top-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #f7931a;
      font-size: 36px;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 24px;
    }

    .card {
      background: #121212;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }

    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f7931a;
      font-size: 22px;
      margin-bottom: 6px;
    }

    .time-away {
      display: inline-block;
      font-size: 12px;
      color: #9ca3af;
      background: #1a1a1a;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .card p {
      margin: 6px 0;
      font-size: 15px;
    }

    .cta {
      display: inline-block;
      margin-top: 14px;
      background: #f7931a;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    /* =========================
       CLEAN FEATURED SIGNUP CARD
       ========================= */

    .signup-card {
      background: linear-gradient(180deg, #151515 0%, #101010 100%);
      border: 1px solid rgba(247,147,26,.28);
      box-shadow:
        0 0 0 1px rgba(0,0,0,.5) inset,
        0 14px 35px rgba(0,0,0,.55);
    }

    .signup-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #f7931a;
      background: rgba(247,147,26,.10);
      border: 1px solid rgba(247,147,26,.22);
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .signup-sub {
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .signup-card .formkit-fields {
      display: flex !important;
      gap: 12px !important;
      flex-wrap: wrap !important;
      margin: 0 !important;
    }

    .signup-card .formkit-field {
      flex: 1 1 240px !important;
      margin: 0 !important;
    }

    .signup-card .formkit-input {
      width: 100% !important;
      background: #0f0f0f !important;
      color: #fff !important;
      border: 1px solid #2a2a2a !important;
      border-radius: 12px !important;
      padding: 13px 14px !important;
      font-size: 15px !important;
    }

    .signup-card .formkit-input:focus {
      outline: none !important;
      border-color: rgba(247,147,26,.55) !important;
      box-shadow: 0 0 0 4px rgba(247,147,26,.12) !important;
    }

    .signup-card .formkit-submit {
      border: none !important;
      border-radius: 12px !important;
      background: #f7931a !important;
      color: #000 !important;
      font-weight: 800 !important;
    }

    .signup-card .formkit-submit > span {
      padding: 13px 16px !important;
    }

    .signup-card .formkit-powered-by-convertkit-container a {
      opacity: .55 !important;
      filter: grayscale(1) !important;
      text-decoration: none !important;
    }

    @media (max-width: 420px) {
      .signup-card .formkit-fields {
        flex-direction: column !important;
      }
      .signup-card .formkit-submit {
        width: 100% !important;
      }
    }
  </style>
</head>

<body>

<div class="top-nav">
  <a href="/submit-event/">Submit Event</a> •
  <a href="/contact">Contact</a>
</div>

<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <div id="cards">
    <!-- Example conference card -->
    <div class="card">
      <img src="https://example.com/image.jpg">
      <h2>Bitchill Island Retreat</h2>
      <div class="time-away">In 7 days</div>
      <p>📍 Próspera, Honduras</p>
      <p>📅 January 18–28, 2026</p>
      <a class="cta">More Info</a>
    </div>

    <!-- SIGNUP CARD -->
    <div class="card signup-card">
      <div class="signup-badge">UPDATES</div>
      <h2>Get conference updates</h2>
      <p class="signup-sub">
        New conferences, speaker additions, and major updates. No spam.
      </p>

      <form action="https://app.kit.com/forms/8960292/subscriptions"
            method="post"
            class="formkit-form"
            data-uid="e84dbf41dd"
            data-format="inline">

        <div class="formkit-fields">
          <div class="formkit-field">
            <input class="formkit-input"
                   name="email_address"
                   type="email"
                   placeholder="Email address"
                   required>
          </div>

          <button class="formkit-submit">
            <span>Get updates</span>
          </button>
        </div>

        <div class="formkit-powered-by-convertkit-container">
          <a href="https://kit.com" target="_blank" rel="nofollow">
            Built with Kit
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script defer src="https://f.convertkit.com/ckjs/ck.5.js"></script>

</body>
</html>

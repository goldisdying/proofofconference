<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Verified Bitcoin events worldwide." />
  <link rel="icon" href="/favicon.ico" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Proof of Conference" />
  <meta property="og:description" content="Verified Bitcoin Events" />
  <meta property="og:url" content="https://www.proofofconference.com/" />
  <meta property="og:image" content="https://www.proofofconference.com/og-proof-of-conference.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Proof of Conference – Verified Bitcoin Events" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Proof of Conference" />
  <meta name="twitter:description" content="Verified Bitcoin Events" />
  <meta name="twitter:image" content="https://www.proofofconference.com/og-proof-of-conference.jpg" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* ---------- TOP NAV ---------- */
    .top-nav {
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 14px 16px;
      font-size: 14px;
    }

    .top-nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
    }

    .top-nav span {
      color: #6b7280;
    }

    /* ---------- MAIN CONTAINER ---------- */
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #f7931a;
      font-size: 36px;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    .card {
      background: #121212;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }

    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f7931a;
      font-size: 22px;
      margin: 0 0 10px;
    }

    .card p {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .discount {
      margin-top: 10px;
      color: #f7931a;
      font-weight: 600;
    }

    .cta {
      display: inline-block;
      margin-top: 14px;
      background: #f7931a;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #1f1f1f;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
  <!-- body unchanged -->
</body>
</html>

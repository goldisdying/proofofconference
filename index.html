<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .top-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 14px 16px;
      font-size: 14px;
      background: #000;
    }

    .top-nav a {
      color: #fff;
      text-decoration: none;
    }

    .top-nav span {
      opacity: 0.4;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    h1 {
      text-align: center;
      color: #f7931a;
      margin-bottom: 6px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 26px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }

    .cards {
      margin-top: 28px;
      display: grid;
      gap: 18px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 16px;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .card h2 {
      font-size: 18px;
      margin: 6px 0;
    }

    .discount {
      background: #f7931a;
      color: #000;
      padding: 6px 10px;
      border-radius: 999px;
      display: inline-block;
      font-size: 13px;
      margin-top: 6px;
      font-weight: 600;
    }

    .cta {
      display: block;
      margin-top: 12px;
      text-align: center;
      padding: 12px;
      background: #f7931a;
      color: #000;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
    }

    option.divider {
      color: #888;
    }
  </style>
</head>

<body>

<div class="top-nav">
  <a href="/submit-event/">Submit Event</a>
  <span>•</span>
  <a href="/contact/">Contact</a>
  <span>•</span>
  <a href="https://fomo21.com" target="_blank">Merch</a>
</div>

<div class="container">

  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="searchInput" placeholder="Search conferences..." />

  <select id="sortFilter">
    <option value="featured">Featured</option>
    <option value="upcoming">Upcoming</option>
    <option value="az">A to Z</option>
    <option value="past">Past</option>
  </select>

  <select id="countryFilter"></select>
  <select id="stateFilter"></select>
  <select id="cityFilter"></select>
  <select id="speakerFilter"></select>

  <div class="cards" id="cards"></div>
</div>

<script>
let conferences = [];
let filtered = [];

const prioritySpeakers = [
  "Michael Saylor",
  "Jack Dorsey",
  "Max Keiser",
  "Jeff Booth",
  "Lyn Alden",
  "Natalie Brunell",
  "Saifedean Ammous",
  "Adam Back",
  "Jack Mallers"
];

fetch("Bitcoin Conference List - Sheet1.csv")
  .then(res => res.text())
  .then(text => {
    const rows = text.split("\n").slice(1);
    conferences = rows.map(r => {
      const cols = r.split(",");
      return {
        Conference: cols[0],
        Country: cols[1],
        State: cols[2],
        City: cols[3],
        Date: cols[4],
        Speakers: cols[5] || "",
        Link: cols[6],
        Image: cols[7],
        Discount: cols[8]
      };
    });

    populateFilters();
    applyFilters();
  });

function populateFilters() {
  const countrySet = new Set();
  const stateSet = new Set();
  const citySet = new Set();
  const speakerSet = new Set();

  conferences.forEach(c => {
    if (c.Country) countrySet.add(c.Country);
    if (c.State) stateSet.add(c.State);
    if (c.City) citySet.add(c.City);
    c.Speakers.split("|").forEach(s => s && speakerSet.add(s.trim()));
  });

  countryFilter.innerHTML = `<option value="">All Countries</option>` +
    [...countrySet].sort().map(c => `<option>${c}</option>`).join("");

  stateFilter.innerHTML = `<option value="">All States</option>` +
    [...stateSet].sort().map(s => `<option>${s}</option>`).join("");

  cityFilter.innerHTML = `<option value="">All Cities</option>` +
    [...citySet].sort().map(c => `<option>${c}</option>`).join("");

  const remaining = [...speakerSet].filter(s => !prioritySpeakers.includes(s)).sort();

  speakerFilter.innerHTML =
    `<option value="">All Speakers / Notable Attendees</option>` +
    prioritySpeakers.map(s => `<option>${s}</option>`).join("") +
    `<option class="divider" disabled>────────────</option>` +
    remaining.map(s => `<option>${s}</option>`).join("");
}

function applyFilters() {
  filtered = conferences.filter(c => {
    if (searchInput.value && !c.Conference.toLowerCase().includes(searchInput.value.toLowerCase())) return false;
    if (countryFilter.value && c.Country !== countryFilter.value) return false;
    if (stateFilter.value && c.State !== stateFilter.value) return false;
    if (cityFilter.value && c.City !== cityFilter.value) return false;
    if (speakerFilter.value && !c.Speakers.includes(speakerFilter.value)) return false;
    return true;
  });

  applySort();
}

function applySort() {
  const mode = sortFilter.value;

  if (mode === "az") {
    filtered.sort((a, b) => a.Conference.localeCompare(b.Conference));
  }

  if (mode === "upcoming") {
    filtered.sort((a, b) => new Date(a.Date) - new Date(b.Date));
  }

  if (mode === "past") {
    filtered.sort((a, b) => new Date(b.Date) - new Date(a.Date));
  }

  render();
}

function render() {
  cards.innerHTML = filtered.map(c => `
    <div class="card">
      ${c.Image ? `<img src="${c.Image}">` : ""}
      <h2>${c.Conference}</h2>
      <p>📍 ${c.City}, ${c.State}, ${c.Country}</p>
      <p>📅 ${c.Date}</p>
      ${c.Discount ? `<div class="discount">${c.Discount}</div>` : ""}
      <a class="cta" href="${c.Link}" target="_blank">Get Tickets</a>
    </div>
  `).join("");
}

searchInput.addEventListener("input", applyFilters);
countryFilter.addEventListener("change", applyFilters);
stateFilter.addEventListener("change", applyFilters);
cityFilter.addEventListener("change", applyFilters);
speakerFilter.addEventListener("change", applyFilters);
sortFilter.addEventListener("change", applyFilters);
</script>

</body>
</html>

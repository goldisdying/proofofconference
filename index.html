<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide. View dates, venues, and promo codes all in one place.">
  <link rel="icon" href="favicon.ico">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 40px 20px 10px;
      background-color: #000;
    }

    h1 {
      color: #f7931a;
      font-size: 2.5rem;
      margin: 0;
    }

    .subheadline {
      color: #fff;
      font-size: 1.2rem;
      margin-top: 8px;
    }

    .cta-buttons {
      margin: 20px 0;
    }

    .cta-buttons button {
      background-color: #f7931a;
      color: #000;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      margin: 5px;
      cursor: pointer;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      background-color: #111;
    }

    .filter-bar input, .filter-bar select {
      padding: 10px;
      border-radius: 5px;
      border: none;
      width: 200px;
    }

    .calendar-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 40px 20px;
      background-color: #111;
    }

    .event-card {
      background-color: #1a1a1a;
      border-radius: 12px;
      border: 2px solid #333;
      margin: 15px;
      padding: 20px;
      width: 320px;
      text-align: left;
      color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .event-card img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border: 3px solid #f7931a;
      border-radius: 8px;
      margin-bottom: 15px;
      background-color: #000;
    }

    .event-card h3 {
      color: #f7931a;
      margin-bottom: 10px;
    }

    .event-card p {
      margin: 4px 0;
      font-size: 0.95rem;
      color: #fff;
    }

    .event-card a {
      background-color: #f7931a;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 8px 0 0;
      display: inline-block;
    }

    .subscribe-section {
      text-align: center;
      padding: 50px 20px;
      background-color: #000;
    }

    .subscribe-section h2 {
      color: #f7931a;
    }

    .subscribe-section input {
      padding: 10px;
      border-radius: 4px;
      border: none;
      width: 250px;
      margin-right: 10px;
    }

    .subscribe-section button {
      padding: 10px 20px;
      background-color: #f7931a;
      border: none;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      color: #aaa;
      background-color: #111;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Proof of Conference</h1>
    <div class="subheadline">Track Every Bitcoin Conference</div>
    <div class="cta-buttons">
      <button onclick="window.scrollTo({ top: document.getElementById('calendar').offsetTop, behavior: 'smooth' })">View All Upcoming Conferences</button>
      <button onclick="document.getElementById('subscribe').scrollIntoView({behavior: 'smooth'})">Subscribe for Discount Alerts</button>
    </div>
  </header>

  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search conferences...">
    <select id="countryFilter">
      <option value="">All Countries</option>
    </select>
    <select id="stateFilter">
      <option value="">All States</option>
    </select>
    <select id="yearFilter">
      <option value="">All Years</option>
    </select>
  </div>

  <section id="calendar" class="calendar-grid"></section>

  <section id="subscribe" class="subscribe-section">
    <h2>Be First in Line for Bitcoin Discounts</h2>
    <p>We’ll email you when new events drop and promo codes go live.</p>
    <input type="email" placeholder="Your email address">
    <button>Subscribe</button>
  </section>

  <footer>
    © 2026 ProofOfConference.com | Affiliate links may support this site. Thanks for using code <strong>FOMO</strong> 🧡
  </footer>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";

    async function loadConferences() {
      const response = await fetch(CSV_URL);
      const data = await response.text();

      const rows = data.trim().split("\n").slice(1);
      const container = document.getElementById("calendar");
      container.innerHTML = "";

      const countries = new Set();
      const states = new Set();
      const years = new Set();

      rows.forEach(row => {
        const cols = row.split(",").map(c => c.trim().replace(/^"|"$/g, ""));
        const [conference, location, venue, dateRange, discount, ticketLink, mainLink, image, notActive] = cols;

        if (notActive.toLowerCase() === "x") return;

        const yearMatch = dateRange.match(/\b(20\d{2})\b/);
        const year = yearMatch ? yearMatch[1] : "";

        const [city = "", country = ""] = location.split(",").map(x => x.trim());

        if (country) countries.add(country);
        if (city) states.add(city);
        if (year) years.add(year);

        const discountHTML = discount ? `<p>🎟️ Use Code: <strong>${discount}</strong></p>` : "";

        const card = document.createElement("div");
        card.classList.add("event-card");
        card.setAttribute("data-country", country);
        card.setAttribute("data-state", city);
        card.setAttribute("data-year", year);

        card.innerHTML = `
          <img src="https://raw.githubusercontent.com/goldisdying/proofofconference/main/${image}" alt="${conference}">
          <h3>${conference}</h3>
          <p>📍 ${location}</p>
          <p>🏛️ ${venue}</p>
          <p>📅 ${dateRange}</p>
          ${discountHTML}
          <a href="${ticketLink}" target="_blank">Get Tickets</a>
          <a href="${mainLink}" target="_blank">More Info</a>
        `;

        container.appendChild(card);
      });

      populateFilters(countries, states, years);
      attachFilterLogic();
    }

    function populateFilters(countries, states, years) {
      const addOptions = (select, items) => {
        items = [...items].sort();
        items.forEach(i => {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = i;
          select.appendChild(opt);
        });
      };
      addOptions(document.getElementById("countryFilter"), countries);
      addOptions(document.getElementById("stateFilter"), states);
      addOptions(document.getElementById("yearFilter"), years);
    }

    function attachFilterLogic() {
      const searchInput = document.getElementById("searchInput");
      const countryFilter = document.getElementById("countryFilter");
      const stateFilter = document.getElementById("stateFilter");
      const yearFilter = document.getElementById("yearFilter");

      function filterCards() {
        const search = searchInput.value.toLowerCase();
        const country = countryFilter.value;
        const state = stateFilter.value;
        const year = yearFilter.value;

        document.querySelectorAll(".event-card").forEach(card => {
          const matchesSearch = card.querySelector("h3").textContent.toLowerCase().includes(search);
          const matchesCountry = !country || card.dataset.country === country;
          const matchesState = !state || card.dataset.state === state;
          const matchesYear = !year || card.dataset.year === year;
          card.style.display = (matchesSearch && matchesCountry && matchesState && matchesYear) ? "block" : "none";
        });
      }

      searchInput.addEventListener("input", filterCards);
      countryFilter.addEventListener("change", filterCards);
      stateFilter.addEventListener("change", filterCards);
      yearFilter.addEventListener("change", filterCards);
    }

    loadConferences();
  </script>
</body>
</html>

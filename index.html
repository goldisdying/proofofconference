<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference</title>
  <meta name="description" content="Track every Bitcoin conference worldwide." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .top-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 14px 16px;
      font-size: 14px;
    }

    .top-nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
    }

    .top-nav span {
      color: #6b7280;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #f7931a;
      font-size: 36px;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      margin-bottom: 20px;
      color: #e5e7eb;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 10px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    .card {
      background: #121212;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }

    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f7931a;
      font-size: 22px;
      margin: 0 0 10px;
    }

    .card p {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.4;
    }

    .discount {
      margin-top: 10px;
      color: #f7931a;
      font-weight: 600;
    }

    .cta {
      display: inline-block;
      margin-top: 14px;
      background: #f7931a;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #1f1f1f;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="top-nav">
  <a href="/submit-event/">Submit Event</a>
  <span>•</span>
  <a href="mailto:LLCStacker@gmail.com">Contact</a>
  <span>•</span>
  <a href="https://fomo21.com" target="_blank">Merch</a>
</div>

<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="search" placeholder="Search conferences..." />

  <select id="sort">
    <option value="featured">Featured</option>
    <option value="upcoming">Upcoming</option>
    <option value="az">A to Z</option>
    <option value="past">Past</option>
  </select>

  <select id="country"><option value="">All Countries</option></select>
  <select id="state"><option value="">All States</option></select>
  <select id="city"><option value="">All Cities</option></select>

  <select id="speaker">
    <option value="">All Speakers / Notable Attendees</option>
  </select>

  <div id="cards"></div>

  <footer>
    <strong>Disclaimer:</strong>
    Proof of Conference is an independent, informational directory and is not affiliated with any conference listed.
  </footer>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";

const PRIORITY_SPEAKERS = [
  "Michael Saylor",
  "Jack Dorsey",
  "Max Keiser",
  "Jeff Booth",
  "Lyn Alden",
  "Natalie Brunell",
  "Saifedean Ammous",
  "Adam Back",
  "Jack Mallers"
];

let conferences = [];
let featuredOrder = [];

function parseCSV(text) {
  const rows = [];
  let row = [], value = "", inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (c === '"' && inQuotes && n === '"') {
      value += '"'; i++;
    } else if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === "," && !inQuotes) {
      row.push(value); value = "";
    } else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (value || row.length) {
        row.push(value);
        rows.push(row);
        row = []; value = "";
      }
    } else {
      value += c;
    }
  }

  if (value || row.length) {
    row.push(value);
    rows.push(row);
  }

  return rows;
}

function clean(t) {
  return (t || "").replace(/[\r\n]+/g, " ").replace(/^"+|"+$/g, "").trim();
}

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const rows = parseCSV(text);
    const headers = rows.shift();

    conferences = rows.map(r =>
      Object.fromEntries(headers.map((h, i) => [h, clean(r[i])]))
    ).filter(c => c["Not Active"]?.toLowerCase() !== "x");

    featuredOrder = [...conferences];

    populateFilters();
    populateSpeakerFilter();
    render();
  });

function populateFilters() {
  ["Country","State","City"].forEach(f => {
    const s = document.getElementById(f.toLowerCase());
    [...new Set(conferences.map(c => c[f]).filter(Boolean))]
      .sort()
      .forEach(v => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        s.appendChild(o);
      });
  });
}

function populateSpeakerFilter() {
  const select = document.getElementById("speaker");
  const speakerSet = new Set();

  conferences.forEach(c => {
    if (c["Speakers/Notable Attendees"]) {
      c["Speakers/Notable Attendees"].split(",")
        .map(s => s.trim())
        .filter(Boolean)
        .forEach(s => speakerSet.add(s));
    }
  });

  PRIORITY_SPEAKERS.forEach(name => {
    if (speakerSet.has(name)) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      select.appendChild(o);
      speakerSet.delete(name);
    }
  });

  const divider = document.createElement("option");
  divider.textContent = "──────";
  divider.disabled = true;
  select.appendChild(divider);

  [...speakerSet].sort().forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    select.appendChild(o);
  });
}

["search","country","state","city","sort","speaker"].forEach(id =>
  document.getElementById(id).addEventListener("input", render)
);

function render() {
  let list = [...featuredOrder];
  cards.innerHTML = "";

  list.forEach(c => {
    if (search.value && !Object.values(c).join(" ").toLowerCase().includes(search.value.toLowerCase())) return;
    if (country.value && c.Country !== country.value) return;
    if (state.value && c.State !== state.value) return;
    if (city.value && c.City !== city.value) return;
    if (speaker.value && !(c["Speakers/Notable Attendees"] || "").includes(speaker.value)) return;

    const location = [c.City, c.State, c.Country].filter(Boolean).join(", ");

    cards.innerHTML += `
      <div class="card">
        ${c.Image ? `<img src="${c.Image}" alt="${c.Conference}">` : ""}
        <h2>${c.Conference}</h2>
        <p>📍 ${location}</p>
        <p>📅 ${c["Date Range"]}</p>
        ${c.Discount ? `<div class="discount">🎟️ ${c.Discount}</div>` : ""}
        <a class="cta" href="${c["Main Conference Link"]}" target="_blank">Get Tickets</a>
      </div>
    `;
  });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Proof of Conference</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Open Graph -->
  <meta property="og:title" content="Proof of Conference" />
  <meta property="og:description" content="An independent directory of verified Bitcoin events worldwide." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://proofofconference.com/" />
  <meta property="og:image" content="https://proofofconference.com/og-proof-of-conference.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    h1 {
      color: #f4a340;
      text-align: center;
      font-size: 36px;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      font-weight: 400;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    .control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .card {
      background: #0d0d0d;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .card h3 {
      color: #f4a340;
      margin: 0 0 8px;
      font-size: 22px;
    }

    .meta {
      opacity: 0.9;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .button {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      background: #f4a340;
      color: #000;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
    }

    .disclaimer {
      margin-top: 48px;
      font-size: 13px;
      opacity: 0.6;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Proof of Conference</h1>
    <h2>Track Every Bitcoin Conference</h2>

    <input id="search" class="control" placeholder="Search conferences…" />

    <select id="sort" class="control">
      <option value="featured">Featured</option>
      <option value="upcoming">Upcoming</option>
      <option value="az">A to Z</option>
      <option value="past">Past</option>
    </select>

    <div id="cards"></div>

    <div class="disclaimer">
      Proof of Conference is an independent, informational directory and is not necessarily affiliated with any listed events.
      Please visit the official conference websites for accurate and up-to-date details.
    </div>
  </div>

<script>
/* ================================
   CONFIG
================================ */
const CSV_URL = "Bitcoin Conference List - Sheet1.csv?v=" + Date.now();

/* ================================
   HELPERS
================================ */
function parseDateRange(text) {
  if (!text) return null;
  const yearMatch = text.match(/\b(20\d{2})\b/);
  if (!yearMatch) return null;
  const year = yearMatch[1];
  const cleaned = text.replace(year, "").replace(/,/g, "").trim();
  const parts = cleaned.split("–");
  const start = new Date(`${parts[0]} ${year}`);
  return isNaN(start) ? null : start;
}

function formatLocation(city, state, country) {
  return [city, state, country].filter(Boolean).join(", ");
}

/* ================================
   LOAD CSV (CACHE BUSTED)
================================ */
fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const rows = text.trim().split("\n").slice(1);
    const events = rows.map(r => {
      const cols = r.split(",");
      return {
        name: cols[0]?.trim(),
        city: cols[1]?.trim(),
        state: cols[2]?.trim(),
        country: cols[3]?.trim(),
        dateText: cols[4]?.trim(),
        url: cols[5]?.trim(),
        featuredOrder: cols[6]?.trim(),
        active: cols[7]?.trim()
      };
    }).filter(e => e.active !== "x");

    init(events);
  });

/* ================================
   RENDER LOGIC
================================ */
function init(events) {
  const search = document.getElementById("search");
  const sort = document.getElementById("sort");
  const cards = document.getElementById("cards");

  function render() {
    const q = search.value.toLowerCase();
    const now = new Date();

    let list = events.filter(e =>
      e.name.toLowerCase().includes(q)
    );

    if (sort.value === "featured") {
      list = list.filter(e => parseDateRange(e.dateText) >= now);
    }

    if (sort.value === "upcoming") {
      list = list
        .filter(e => parseDateRange(e.dateText) >= now)
        .sort((a,b) => parseDateRange(a.dateText) - parseDateRange(b.dateText));
    }

    if (sort.value === "az") {
      list = list
        .filter(e => parseDateRange(e.dateText) >= now)
        .sort((a,b) => a.name.localeCompare(b.name));
    }

    if (sort.value === "past") {
      list = list
        .filter(e => parseDateRange(e.dateText) < now)
        .sort((a,b) => parseDateRange(b.dateText) - parseDateRange(a.dateText));
    }

    cards.innerHTML = list.map(e => `
      <div class="card">
        <h3>${e.name}</h3>
        <div class="meta">📍 ${formatLocation(e.city, e.state, e.country)}</div>
        <div class="meta">📅 ${e.dateText}</div>
        <a class="button" href="${e.url}" target="_blank">Get Tickets</a>
      </div>
    `).join("");
  }

  search.addEventListener("input", render);
  sort.addEventListener("change", render);
  render();
}
</script>
</body>
</html>

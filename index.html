<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference | Bitcoin Conferences & Event Discounts Worldwide</title>
  <meta name="description" content="Discover verified Bitcoin conferences worldwide, including upcoming events, speakers, and available conference discount or promo codes." />
  <link rel="canonical" href="https://www.proofofconference.com/" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { margin:0; background:#000; color:#fff; font-family:Inter,system-ui,sans-serif; }
    .top-nav { display:flex; justify-content:center; gap:14px; padding:14px; font-size:14px; }
    .top-nav a { color:#fff; text-decoration:none; font-weight:500; }
    .container { max-width:480px; margin:0 auto; padding:20px; }
    h1 { color:#f7931a; font-size:36px; text-align:center; margin-bottom:6px; }
    .subtitle { text-align:center; font-size:18px; margin-bottom:24px; }
    .filter-label { font-size:13px; font-weight:600; color:#8df608; margin:0 0 6px 4px; }
    input, select { width:100%; padding:12px 16px; border-radius:24px; border:none; font-size:16px; }
    .filter-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .filter-row select { flex:1; }
    .clear-btn { width:32px; height:32px; border-radius:50%; border:1px solid #2a2a2a; background:#121212; color:#9ca3af; font-size:20px; cursor:pointer; display:none; }
    .card { background:#121212; border-radius:18px; padding:16px; margin-bottom:22px; box-shadow:0 0 0 1px #1f1f1f; }
    .card img { width:100%; border-radius:14px; margin-bottom:12px; }
    .card h2 { color:#f7931a; font-size:22px; margin-bottom:4px; }
    .time-away { font-size:12px; color:#9ca3af; background:#1a1a1a; padding:4px 10px; border-radius:999px; display:inline-block; margin-bottom:6px; }
    .attendance { font-size:14px; color:#9ca3af; margin-top:4px; }
    .discount { margin-top:10px; color:#8df608; font-weight:600; }
    .cta { display:inline-block; margin-top:14px; background:#f7931a; color:#000; padding:12px 18px; border-radius:10px; font-weight:700; text-decoration:none; }
    footer { margin-top:40px; padding-top:20px; border-top:1px solid #1f1f1f; font-size:13px; color:#9ca3af; text-align:center; }
  </style>
</head>

<body>

<div class="top-nav">
  <a href="/submit-event/">Submit Event</a> •
  <a href="/contact">Contact</a>
</div>

<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="search" placeholder="Search conferences..." />

  <div class="filter-label">Sort Conferences</div>
  <select id="sort">
    <option value="upcoming">Upcoming</option>
    <option value="discounts">Conference Discounts</option>
    <option value="az">A to Z</option>
    <option value="past">Past</option>
  </select>

  <!-- NEW SIZE FILTER -->
  <div class="filter-row">
    <select id="size">
      <option value="">All Conference Sizes</option>
      <option value="small">🧍 Small (≤500)</option>
      <option value="medium">👥 Medium (500–2,000)</option>
      <option value="large">🏟️ Large (2,000+)</option>
    </select>
    <button class="clear-btn" data-target="size">×</button>
  </div>

  <div id="cards"></div>

  <footer>
    <p>© 2026 Proof of Conference</p>
  </footer>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";

const SIZE_LABELS = {
  small: "🧍 Small",
  medium: "👥 Medium",
  large: "🏟️ Large"
};

const $ = id => document.getElementById(id);
const searchEl = $("search");
const sortEl = $("sort");
const sizeEl = $("size");
const cardsEl = $("cards");

let conferences = [];

/* ===== DO NOT TOUCH: ORIGINAL CSV PARSER ===== */
function parseCSV(text) {
  const rows = [];
  let row = [], val = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i+1];
    if (c === '"' && inQuotes && n === '"') { val += '"'; i++; }
    else if (c === '"') inQuotes = !inQuotes;
    else if (c === "," && !inQuotes) { row.push(val); val = ""; }
    else if ((c === "\n" || c === "\r") && !inQuotes) {
      if (val || row.length) { row.push(val); rows.push(row); row=[]; val=""; }
    } else val += c;
  }
  if (val || row.length) { row.push(val); rows.push(row); }
  return rows;
}

function clean(t) {
  return (t || "").replace(/[\r\n]+/g," ").replace(/^"+|"+$/g,"").trim();
}

function classifySize(n) {
  if (!n || isNaN(n)) return null;
  if (n <= 500) return "small";
  if (n <= 2000) return "medium";
  return "large";
}

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const rows = parseCSV(text);
    const headers = rows.shift();
    conferences = rows.map(r =>
      Object.fromEntries(headers.map((h,i)=>[h, clean(r[i])]))
    );
    render();
  });

[searchEl, sortEl, sizeEl].forEach(el => el.addEventListener("input", render));

function render() {
  const q = searchEl.value.toLowerCase();
  const sizeFilter = sizeEl.value;

  const html = conferences.filter(c => {
    if (q && !Object.values(c).join(" ").toLowerCase().includes(q)) return false;
    if (sizeFilter) {
      const sz = classifySize(Number(c["Expected Attendance"]));
      if (sz !== sizeFilter) return false;
    }
    return true;
  }).map(c => {
    const attendance = Number(c["Expected Attendance"]);
    const size = classifySize(attendance);

    return `
      <div class="card">
        <h2>${c.Conference}</h2>
        ${attendance ? `<div class="attendance">${SIZE_LABELS[size]} · ${attendance.toLocaleString()} attendees</div>` : ""}
        <p>📅 ${c["Date Range"]}</p>
        <a class="cta" href="${c["Main Conference Link"]}" target="_blank">More Info</a>
      </div>`;
  }).join("");

  cardsEl.innerHTML = html || `<div class="card"><p>No matching conferences.</p></div>`;
}
</script>

</body>
</html>

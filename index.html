<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference | Bitcoin Conferences & Event Discounts Worldwide</title>
  <meta name="description" content="Discover verified Bitcoin conferences worldwide, including upcoming events, speakers, and available conference discount or promo codes." />
  <link rel="canonical" href="https://www.proofofconference.com/" />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { margin:0; background:#000; color:#fff; font-family:Inter,system-ui }
    .container { max-width:480px; margin:0 auto; padding:20px }
    h1 { color:#f7931a; text-align:center; font-size:36px }
    .subtitle { text-align:center; margin-bottom:24px }
    input,select { width:100%; padding:12px 16px; border-radius:24px; border:none; font-size:16px }
    .filter-row { display:flex; gap:10px; margin-bottom:10px }
    .filter-row select { flex:1 }
    .clear-btn { width:32px; height:32px; border-radius:50%; background:#121212; color:#9ca3af; border:1px solid #2a2a2a; display:none }
    .card { background:#121212; border-radius:18px; padding:16px; margin-bottom:22px; box-shadow:0 0 0 1px #1f1f1f }
    .card img { width:100%; border-radius:14px; margin-bottom:12px }
    .card h2 { color:#f7931a; font-size:22px; margin-bottom:4px }
    .time-away { display:inline-block; font-size:12px; background:#1a1a1a; padding:4px 10px; border-radius:999px; margin-bottom:8px }
    .card p { margin:6px 0; font-size:15px }
    .discount { color:#8df608; font-weight:600; margin-top:10px }
    .cta { display:inline-block; margin-top:14px; background:#f7931a; color:#000; padding:12px 18px; border-radius:10px; font-weight:700; text-decoration:none }
  </style>
</head>

<body>
<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="search" placeholder="Search conferences..." />

  <div class="filter-row">
    <select id="attendance">
      <option value="">All Conference Sizes</option>
      <option>0–100</option>
      <option>101–200</option>
      <option>201–500</option>
      <option>501–1,000</option>
      <option>1,001–2,000</option>
      <option>2,001–5,000</option>
      <option>5,001–9,999</option>
      <option>10,000+</option>
    </select>
    <button class="clear-btn" data-target="attendance">×</button>
  </div>

  <div id="cards"></div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";
const $ = id => document.getElementById(id);

let conferences = [];

function parseCSV(text) {
  const rows = [];
  let row=[], val="", inQuotes=false;
  for (let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if (c=='"' && inQuotes && n=='"'){ val+='"'; i++; }
    else if (c=='"') inQuotes=!inQuotes;
    else if (c=="," && !inQuotes){ row.push(val); val=""; }
    else if ((c=="\n"||c=="\r") && !inQuotes){
      if (val||row.length){ row.push(val); rows.push(row); row=[]; val=""; }
    } else val+=c;
  }
  if (val||row.length){ row.push(val); rows.push(row); }
  return rows;
}

fetch(CSV_URL)
  .then(r=>r.text())
  .then(text=>{
    const rows=parseCSV(text);
    const headers=rows.shift();
    conferences=rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||"").trim()])))
      .filter(c=>c["Not Active"]!=="x");
    render();
  });

["search","attendance"].forEach(id=>{
  $(id).addEventListener("input",render);
});

function render(){
  const q=$("search").value.toLowerCase();
  const size=$("attendance").value;

  $("cards").innerHTML=conferences
    .filter(c=>{
      if (q && !Object.values(c).join(" ").toLowerCase().includes(q)) return false;
      if (size && c["Expected Attendance"]!==size) return false;
      return true;
    })
    .map(c=>`
      <div class="card">
        ${c.Image?`<img src="${c.Image}">`:""}
        <h2>${c.Conference}</h2>
        <p>📍 ${[c.City,c.Country].filter(Boolean).join(", ")}</p>
        <p>📅 ${c["Date Range"]}</p>
        ${c["Expected Attendance"]?`<p>👤 Expected Attendance: ${c["Expected Attendance"]}</p>`:""}
        ${c.Discount?`<div class="discount">🎟️ ${c.Discount}</div>`:""}
        <a class="cta" href="${c["Main Conference Link"]}" target="_blank">More Info</a>
      </div>
    `).join("");
}
</script>
</body>
</html>

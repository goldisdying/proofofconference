<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Proof of Conference | Bitcoin Conferences & Event Discounts Worldwide</title>
  <meta name="description" content="Discover verified Bitcoin conferences worldwide with speakers, dates, and available discounts." />
  <meta name="keywords" content="bitcoin conferences, bitcoin events, crypto conferences, blockchain events" />
  <link rel="canonical" href="https://www.proofofconference.com/" />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .top-nav {
      text-align: center;
      padding: 14px;
      font-size: 14px;
    }

    .top-nav a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      margin-bottom: 24px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .card {
      background: #121212;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 22px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }

    .card img {
      width: 100%;
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #f7931a;
      font-size: 22px;
    }

    .time-away {
      display: inline-block;
      font-size: 12px;
      color: #9ca3af;
      background: #1a1a1a;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .cta {
      display: inline-block;
      margin-top: 14px;
      background: #f7931a;
      color: #000;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    /* ===== Subscribe card ===== */

    .subscribe-card {
      border: 1px solid rgba(247,147,26,.35);
      background: linear-gradient(180deg, #141414, #0e0e0e);
    }

    .subscribe-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      color: #f7931a;
      background: rgba(247,147,26,.12);
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .subscribe-card p {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 12px;
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #1f1f1f;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
  </style>

  <script src="https://f.convertkit.com/ckjs/ck.5.js"></script>
</head>

<body>

<div class="top-nav">
  <a href="/submit-event/">Submit Event</a> •
  <a href="/contact">Contact</a>
</div>

<div class="container">
  <h1>Proof of Conference</h1>
  <div class="subtitle">Track Every Bitcoin Conference</div>

  <input id="search" placeholder="Search conferences..." />
  <div id="cards"></div>

  <footer>
    © 2026 Proof of Conference
  </footer>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/goldisdying/proofofconference/main/Bitcoin%20Conference%20List%20-%20Sheet1.csv";
const cardsEl = document.getElementById("cards");
const searchEl = document.getElementById("search");

let conferences = [];

function subscribeCardHTML() {
  return `
    <div class="card subscribe-card">
      <div class="subscribe-badge">UPDATES</div>
      <h2>Get conference updates</h2>
      <p>New conferences, speaker additions, and major updates. No spam.</p>

      <form
        action="https://app.kit.com/forms/8960292/subscriptions"
        method="post"
        class="seva-form formkit-form"
        data-sv-form="8960292"
        data-format="inline"
        data-version="5">
        <input type="email" name="email_address" placeholder="Email address" required />
        <button type="submit" class="cta" style="width:100%;margin-top:8px;">
          Get updates
        </button>
      </form>
    </div>
  `;
}

function render() {
  const q = searchEl.value.toLowerCase();

  const filtered = conferences.filter(c =>
    !q || Object.values(c).join(" ").toLowerCase().includes(q)
  );

  let html = "";

  filtered.forEach((c, i) => {
    if (i === 3 && filtered.length >= 6) {
      html += subscribeCardHTML();
    }

    html += `
      <div class="card">
        ${c.Image ? `<img src="${c.Image}" />` : ""}
        <h2>${c.Conference}</h2>
        <div class="time-away">${c["Time Away"] || ""}</div>
        <p>📍 ${c.City}, ${c.Country}</p>
        <p>📅 ${c["Date Range"]}</p>
        <a class="cta" href="${c.Link}" target="_blank">More Info</a>
      </div>
    `;
  });

  cardsEl.innerHTML = html || `<div class="card">No matching conferences.</div>`;
}

fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    const [header, ...rows] = text.trim().split("\n");
    const keys = header.split(",");

    conferences = rows.map(r => {
      const values = r.split(",");
      return Object.fromEntries(keys.map((k,i)=>[k,values[i]||""]));
    });

    render();
  });

searchEl.addEventListener("input", render);
</script>

</body>
</html>

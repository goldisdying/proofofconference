<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Submit Event | Proof of Conference</title>
  <meta name="description" content="Submit a Bitcoin conference or event to Proof of Conference." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, sans-serif;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 6px;
      font-size: 34px;
    }
    .subtitle {
      text-align: center;
      color: #ccc;
      margin-bottom: 28px;
      font-size: 16px;
    }
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 24px;
      border: none;
      font-size: 16px;
      box-sizing: border-box;
    }
    .hint {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 6px;
    }
    button {
      width: 100%;
      margin-top: 30px;
      padding: 14px;
      background: #f7931a;
      color: #000;
      border: none;
      border-radius: 24px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Submit Event</h1>
  <div class="subtitle">Submit a Bitcoin conference or event for review</div>

  <form action="https://formspree.io/f/xpqwvrzk" method="POST" novalidate>

    <label>Event Name *</label>
    <input type="text" name="event_name" required>

    <label>Event Website *</label>
    <input
      type="text"
      name="website"
      placeholder="fomo21.com"
      required
      autocomplete="off"
    >
    <div class="hint">No http required</div>

    <label>Contact Email *</label>
    <input
      type="email"
      name="email"
      placeholder="you@example.com"
      required
    >

    <button type="submit" formnovalidate>
      Submit Event
    </button>

  </form>
</div>
</body>
</html>

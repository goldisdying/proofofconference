<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Submit Event | Proof of Conference</title>
  <meta name="description" content="Submit a Bitcoin conference or event to Proof of Conference." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .nav a {
      color: #f7931a;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 6px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #ccc;
      margin-bottom: 28px;
    }

    form {
      background: #121212;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 0 0 1px #1f1f1f;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }

    .radio-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    button {
      margin-top: 22px;
      width: 100%;
      background: #f7931a;
      color: #000;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="nav">
      <a href="/">← Back to Events</a>
      <a href="/submit-event">Submit Event</a>
    </div>

    <h1>Submit an Event</h1>
    <div class="subtitle">
      Submit your Bitcoin conference or event for review.
    </div>

    <form action="https://formspree.io/f/xpqwvrzk" method="POST">

      <label>Event Name *</label>
      <input type="text" name="Event Name" required />

      <label>Date (MM/DD/YYYY) *</label>
      <input type="text" name="Event Date" placeholder="06/11/2026" required />

      <label>Location (City, State, Country) *</label>
      <input type="text" name="Location" placeholder="Prague, Czech Republic" required />

      <label>Venue</label>
      <input type="text" name="Venue" />

      <label>Event Website *</label>
      <input type="url" name="Website" required />

      <label>Contact Email *</label>
      <input type="email" name="Email" required />

      <label>Can you provide a discount code?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="Discount Code Available" value="Yes" required />
          Yes
        </label>
        <label>
          <input type="radio" name="Discount Code Available" value="No" />
          No
        </label>
      </div>

      <button type="submit">Submit Event</button>
    </form>

    <footer>
      Submissions are reviewed before being added.<br>
      Proof of Conference is an independent directory.
    </footer>

  </div>
</body>
</html>

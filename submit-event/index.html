<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Submit Event | Proof of Conference</title>
  <meta name="description" content="Submit a Bitcoin conference or event to Proof of Conference." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
    }
    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 28px;
      line-height: 1.4;
    }
    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 6px;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }
    select:disabled {
      opacity: 0.5;
    }
    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .radio-group label {
      font-weight: 400;
      margin: 0;
      font-size: 14px;
    }
    .inline-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    button {
      margin-top: 28px;
      width: 100%;
      background: #f7931a;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }
    a {
      color: #f7931a;
      text-decoration: none;
    }
  </style>
</head>

<body>
<div class="container">
  <h1>Submit an Event</h1>
  <div class="subtitle">
    Submit a Bitcoin conference or event for inclusion on Proof of Conference.
  </div>

  <form action="https://formspree.io/f/xpqwvrzk" method="POST" data-formspree-honeypot="company">

    <input type="text" name="company" tabindex="-1" autocomplete="off" style="display:none">

    <label>Event Name *</label>
    <input type="text" name="event_name" required>

    <label>Event Start Date *</label>
    <input type="date" name="start_date" id="start_date" required>
    <div class="hint">Must be today or later</div>

    <label>Event End Date *</label>
    <input type="date" name="end_date" id="end_date" required>
    <div class="hint">Can be the same as the start date</div>

    <label>City *</label>
    <input type="text" name="city" required>

    <label>Country *</label>
    <select name="country" id="country" required>

      <option>United States</option>

      <option>Angola</option><option>Antigua and Barbuda</option><option>Argentina</option><option>Armenia</option>

      <option>Colombia</option><option>Comoros</option><option>Congo</option><option>Costa Rica</option>
      <option>Croatia</option><option>Cuba</option><option>Cyprus</option><option>Czech Republic</option>
      <option>Denmark</option><option>Djibouti</option><option>Dominica</option><option>Dominican Republic</option>
      <option>Ecuador</option><option>Egypt</option><option>El Salvador</option><option>Equatorial Guinea</option>
      <option>Eritrea</option><option>Estonia</option><option>Eswatini</option><option>Ethiopia</option>
      <option>Fiji</option><option>Finland</option><option>France</option><option>Gabon</option>
      <option>Gambia</option><option>Georgia</option><option>Germany</option><option>Ghana</option>
      <option>Greece</option><option>Grenada</option><option>Guatemala</option><option>Guinea</option>
      <option>Guinea-Bissau</option><option>Guyana</option><option>Haiti</option><option>Honduras</option>
      <option>Hungary</option><option>Iceland</option><option>India</option><option>Indonesia</option>
      <option>Iran</option><option>Iraq</option><option>Ireland</option><option>Israel</option>
      <option>Italy</option><option>Jamaica</option><option>Japan</option><option>Jordan</option>
      <option>Kazakhstan</option><option>Kenya</option><option>Kiribati</option><option>Kuwait</option>
      <option>Kyrgyzstan</option><option>Laos</option><option>Latvia</option><option>Lebanon</option>

      <option>Lithuania</option><option>Luxembourg</option><option>Madagascar</option><option>Malawi</option>

      <option>Marshall Islands</option><option>Mauritania</option><option>Mauritius</option><option>Mexico</option>
      <option>Micronesia</option><option>Moldova</option><option>Monaco</option><option>Mongolia</option>

      <option>North Macedonia</option><option>Norway</option><option>Oman</option><option>Pakistan</option>
      <option>Palau</option><option>Panama</option><option>Papua New Guinea</option><option>Paraguay</option>
      <option>Peru</option><option>Philippines</option><option>Poland</option><option>Portugal</option>

      <option>Saint Kitts and Nevis</option><option>Saint Lucia</option>
      <option>Saint Vincent and the Grenadines</option>

      <option>Saudi Arabia</option><option>Senegal</option><option>Serbia</option><option>Seychelles</option>
      <option>Sierra Leone</option><option>Singapore</option><option>Slovakia</option><option>Slovenia</option>

      <option>Suriname</option><option>Sweden</option><option>Switzerland</option><option>Syria</option>
      <option>Taiwan</option><option>Tajikistan</option><option>Tanzania</option><option>Thailand</option>
      <option>Timor-Leste</option><option>Togo</option><option>Tonga</option>
      <option>Trinidad and Tobago</option><option>Tunisia</option><option>Turkey</option>
      <option>Turkmenistan</option><option>Tuvalu</option><option>Uganda</option>
      <option>Ukraine</option><option>United Arab Emirates</option>
      <option>United Kingdom</option><option>Uruguay</option><option>Uzbekistan</option>
      <option>Vanuatu</option><option>Vatican City</option><option>Venezuela</option>

    </select>

    <label>State / Territory</label>
    <select name="state" id="state" disabled>
      <option value="">Select state</option>
      <option>Alabama</option><option>Alaska</option><option>Arizona</option><option>Arkansas</option>
      <option>California</option><option>Colorado</option><option>Connecticut</option><option>Delaware</option>
      <option>Florida</option><option>Georgia</option><option>Hawaii</option><option>Idaho</option>
      <option>Illinois</option><option>Indiana</option><option>Iowa</option><option>Kansas</option>
      <option>Kentucky</option><option>Louisiana</option><option>Maine</option><option>Maryland</option>
      <option>Massachusetts</option><option>Michigan</option><option>Minnesota</option><option>Mississippi</option>
      <option>Missouri</option><option>Montana</option><option>Nebraska</option><option>Nevada</option>
      <option>New Hampshire</option><option>New Jersey</option><option>New Mexico</option><option>New York</option>
      <option>North Carolina</option><option>North Dakota</option><option>Ohio</option><option>Oklahoma</option>

    <label>Venue</label>
    <input type="text" name="venue">

    <label>Event Website *</label>
    <input type="url" name="website" id="website" placeholder="https://example.com" required>

    <label>Contact Email *</label>
    <input type="email" name="email" required>

    <label>Is there a discount code available for Proof of Conference users?</label>
    <div class="radio-group">
      <label><input type="radio" name="discount_code" value="Yes" required> Yes</label>
      <label><input type="radio" name="discount_code" value="No"> No</label>
    </div>

    <div id="discount-details" style="display:none;">
      <label>What is the discount per ticket?</label>
      <div class="hint">% or USD</div>
      <div class="inline-group">
        <input type="text" name="discount_value" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 10">
        <select name="discount_type">
          <option value="%">%</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>

    <label>Do you offer an affiliate or referral commission on ticket sales?</label>
    <div class="radio-group">
      <label><input type="radio" name="affiliate_program" value="Yes" required> Yes</label>
      <label><input type="radio" name="affiliate_program" value="No"> No</label>
    </div>

    <div id="affiliate-details" style="display:none;">
      <label>What is the commission per ticket?</label>
      <div class="hint">% or USD</div>
      <div class="inline-group">
        <input type="text" name="affiliate_value" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 20">
        <select name="affiliate_type">
          <option value="%">%</option>
          <option value="USD">USD</option>
        </select>
      </div>
    </div>

    <button type="submit">Submit Event</button>
  </form>

  <footer>
    <a href="/">← Back to Proof of Conference</a>
  </footer>
</div>

<script>
  const today = new Date().toISOString().split("T")[0];
  const start = document.getElementById("start_date");
  const end = document.getElementById("end_date");
  const country = document.getElementById("country");
  const state = document.getElementById("state");
  const website = document.getElementById("website");

  start.min = today;
  end.min = today;

  start.addEventListener("change", () => end.min = start.value);

  country.addEventListener("change", () => {
    if (country.value === "United States") {
      state.disabled = false;
      state.required = true;
    } else {
      state.disabled = true;
      state.required = false;
      state.value = "";
    }
  });

  website.addEventListener("blur", () => {
    if (website.value && !/^https?:\/\//i.test(website.value)) {
      website.value = "https://" + website.value;
    }
  });

  document.querySelectorAll('input[inputmode="numeric"]').forEach(input => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9]/g, "");
    });
  });

  function enforcePercentageLimit(valueInput, typeSelect) {
    if (typeSelect.value === "%" && valueInput.value !== "") {
      if (parseInt(valueInput.value, 10) > 100) {
        valueInput.value = "100";
      }
    }
  }

  function attachLimitHandlers(valueName, typeName) {
    const valueInput = document.querySelector(`input[name="${valueName}"]`);
    const typeSelect = document.querySelector(`select[name="${typeName}"]`);

    valueInput.addEventListener("input", () => enforcePercentageLimit(valueInput, typeSelect));
    typeSelect.addEventListener("change", () => enforcePercentageLimit(valueInput, typeSelect));
  }

  attachLimitHandlers("discount_value", "discount_type");
  attachLimitHandlers("affiliate_value", "affiliate_type");

  function toggleDetails(radiosName, containerId, inputName) {
    const radios = document.querySelectorAll(`input[name="${radiosName}"]`);
    const container = document.getElementById(containerId);
    const input = container.querySelector(`input[name="${inputName}"]`);

    radios.forEach(radio => {
      radio.addEventListener("change", () => {
        if (radio.value === "Yes") {
          container.style.display = "block";
          input.required = true;
        } else {
          container.style.display = "none";
          input.required = false;
          input.value = "";
        }
      });
    });
  }

  toggleDetails("discount_code", "discount-details", "discount_value");
  toggleDetails("affiliate_program", "affiliate-details", "affiliate_value");
</script>
</body>
</html>

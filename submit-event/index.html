<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Submit Event | Proof of Conference</title>
  <meta name="description" content="Submit a Bitcoin conference or event to Proof of Conference." />
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    h1 {
      color: #f7931a;
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 18px 0 6px;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    .radio-group label {
      font-weight: 400;
      margin: 0;
      font-size: 14px;
    }

    .hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }

    button {
      margin-top: 28px;
      width: 100%;
      background: #f7931a;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
    }

    a {
      color: #f7931a;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Submit an Event</h1>
    <div class="subtitle">
      Submit a Bitcoin conference or event for inclusion on Proof of Conference.
    </div>

    <form action="https://formspree.io/f/xpqwvrzk" method="POST">

      <label>Event Name *</label>
      <input type="text" name="event_name" required />

      <label>Event Start Date *</label>
      <input type="date" name="start_date" required />
      <div class="hint">MM/DD/YYYY</div>

      <label>Event End Date</label>
      <input type="date" name="end_date" />
      <div class="hint">Leave blank for single-day events</div>

      <label>Location (City, State, Country) *</label>
      <input type="text" name="location" required />

      <label>Venue</label>
      <input type="text" name="venue" />

      <label>Event Website *</label>
      <input type="url" name="website" required />

      <label>Contact Email *</label>
      <input type="email" name="email" required />

      <label>Are you able to provide a discount code for the event?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="discount_code" value="Yes" required />
          Yes
        </label>
        <label>
          <input type="radio" name="discount_code" value="No" />
          No
        </label>
      </div>

      <label>Do you have an affiliate program for ticket sales?</label>
      <div class="radio-group">
        <label>
          <input type="radio" name="affiliate_program" value="Yes" required />
          Yes
        </label>
        <label>
          <input type="radio" name="affiliate_program" value="No" />
          No
        </label>
      </div>

      <button type="submit">Submit Event</button>
    </form>

    <footer>
      <a href="/">← Back to Proof of Conference</a>
    </footer>
  </div>
</body>
</html>

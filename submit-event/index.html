<script>
  const today = new Date().toISOString().split("T")[0];
  const start = document.getElementById("start_date");
  const end = document.getElementById("end_date");
  const country = document.getElementById("country");
  const state = document.getElementById("state");
  const website = document.getElementById("website");

  start.min = today;
  end.min = today;

  start.addEventListener("change", () => end.min = start.value);

  country.addEventListener("change", () => {
    if (country.value === "United States") {
      state.disabled = false;
      state.required = true;
    } else {
      state.disabled = true;
      state.required = false;
      state.value = "";
    }
  });

  website.addEventListener("blur", () => {
    if (website.value && !/^https?:\/\//i.test(website.value)) {
      website.value = "https://" + website.value;
    }
  });

  document.querySelectorAll('input[inputmode="numeric"]').forEach(input => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/[^0-9]/g, "");
    });
  });

  function enforcePercentageLimit(valueInput, typeSelect) {
    if (typeSelect.value === "%" && valueInput.value !== "") {
      if (parseInt(valueInput.value, 10) > 100) {
        valueInput.value = "100";
      }
    }
  }

  function attachLimitHandlers(valueName, typeName) {
    const valueInput = document.querySelector(`input[name="${valueName}"]`);
    const typeSelect = document.querySelector(`select[name="${typeName}"]`);

    valueInput.addEventListener("input", () => enforcePercentageLimit(valueInput, typeSelect));
    typeSelect.addEventListener("change", () => enforcePercentageLimit(valueInput, typeSelect));
  }

  attachLimitHandlers("discount_value", "discount_type");
  attachLimitHandlers("affiliate_value", "affiliate_type");

  function toggleDetails(radiosName, containerId, inputName) {
    const radios = document.querySelectorAll(`input[name="${radiosName}"]`);
    const container = document.getElementById(containerId);
    const input = container.querySelector(`input[name="${inputName}"]`);

    radios.forEach(radio => {
      radio.addEventListener("change", () => {
        if (radio.value === "Yes") {
          container.style.display = "block";
          input.required = true;
        } else {
          container.style.display = "none";
          input.required = false;
          input.value = "";
        }
      });
    });
  }

  toggleDetails("discount_code", "discount-details", "discount_value");
  toggleDetails("affiliate_program", "affiliate-details", "affiliate_value");
</script>

  ov.classList.toggle('open', opening);
}
var langLabels = {'en': '🇺🇸 English', 'es': '🇪🇸 Español', 'pt': '🇧🇷 Português', 'de': '🇩🇪 Deutsch', 'nl': '🇳🇱 Nederlands', 'fr': '🇫🇷 Français', 'ar': '🇸🇦 العربية', 'zh-CN': '🇨🇳 中文 (简体)', 'ja': '🇯🇵 日本語', 'ko': '🇰🇷 한국어', 'ru': '🇷🇺 Русский', 'af': '🇿🇦 Afrikaans', 'am': '🇪🇹 አማርኛ', 'bn': '🇧🇩 বাংলা', 'zh-TW': '🇹🇼 中文 (繁體)', 'cs': '🇨🇿 Čeština', 'da': '🇩🇰 Dansk', 'fi': '🇫🇮 Suomi', 'el': '🇬🇷 Ελληνικά', 'iw': '🇮🇱 עברית', 'hi': '🇮🇳 हिन्दी', 'hu': '🇭🇺 Magyar', 'id': '🇮🇩 Bahasa Indonesia', 'it': '🇮🇹 Italiano', 'ms': '🇲🇾 Bahasa Melayu', 'no': '🇳🇴 Norsk', 'fa': '🇮🇷 فارسی', 'tl': '🇵🇭 Filipino', 'pl': '🇵🇱 Polski', 'ro': '🇷🇴 Română', 'sk': '🇸🇰 Slovenčina', 'sv': '🇸🇪 Svenska', 'sw': '🇰🇪 Kiswahili', 'th': '🇹🇭 ภาษาไทย', 'tr': '🇹🇷 Türkçe', 'uk': '🇺🇦 Українська', 'ur': '🇵🇰 اردو', 'vi': '🇻🇳 Tiếng Việt'};
function doTranslate(lang) {
  if (lang === '') return;
  // Update button label
  var btn = document.getElementById('translate-btn-label');
  if (btn && langLabels[lang]) btn.textContent = langLabels[lang];
  // If English selected, clear translation and reload
  if (lang === 'en') {
    // Set cookie to en|en (not just delete — Google re-reads the hash otherwise)
    document.cookie = 'googtrans=/en/en; path=/;';
    document.cookie = 'googtrans=/en/en; path=/; domain=' + location.hostname + ';';
    document.cookie = 'googtrans=/en/en; path=/; domain=.' + location.hostname + ';';
    // Strip any googtrans hash from URL then reload
    var clean = window.location.href
      .replace(/#googtrans\([^)]*\)/g, '')
      .replace(/#$/, '');
    window.location.replace(clean);
    return;
  }
  var sel = document.querySelector('.goog-te-combo');
  if (sel) {
    sel.value = lang;
    sel.dispatchEvent(new Event('change'));
  }
  closeTranslate();
}
document.addEventListener('click', function(e) {
  var dd = document.getElementById('translate-dropdown');
  if (dd && !dd.contains(e.target) && !e.target.classList.contains('translate-btn')) {
    closeTranslate();
  }
});

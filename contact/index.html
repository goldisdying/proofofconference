  <div class="container">
    <h1>Contact</h1>
    <p class="subtitle">
      Have a question, partnership idea, or event submission? Send us a message.
    </p>

    <form
      action="https://formspree.io/f/xykzrjqg"
      method="POST"
    >
      <!-- Honeypot field -->
      <input type="text" name="_gotcha" style="display:none">

      <!-- Form metadata -->
      <input type="hidden" name="_subject" value="Proof of Conference — Contact Form Submission">
      <input type="hidden" name="_format" value="plain">
      <input type="hidden" name="_submission_method" value="html">
      <input type="hidden" name="source" value="proofofconference.com contact page">

      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        required
        placeholder="Your name"
      />

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="you@example.com"
      />

      <label for="topic">What can we help you with?</label>
      <select id="topic" name="topic" required>
        <option value="" disabled selected>Select an option</option>
        <option>General question</option>
        <option>Partnership / sponsorship</option>
        <option>Submit an event</option>
        <option>Media / press</option>
        <option>Technical issue</option>
        <option>Other</option>
      </select>

      <label for="message">Share the details of your inquiry</label>
      <textarea
        id="message"
        name="message"
        minlength="100"
        maxlength="400"
        required
        placeholder="Please include as much detail as possible (100–400 characters)."
      ></textarea>

      <div class="hint">
        Minimum 100 characters. Maximum 400 characters.
      </div>

      <button type="submit">Send Message</button>
    </form>

<!-- Google Translate -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    autoDisplay: false,
    multilanguagePage: true,
  }, 'google_translate_element');
}
function closeTranslate() {
  document.getElementById('translate-dropdown').classList.remove('open');
  document.getElementById('translate-overlay').classList.remove('open');
}
function toggleTranslate(e) {
  e.stopPropagation();
  var dd = document.getElementById('translate-dropdown');
  var ov = document.getElementById('translate-overlay');
  var opening = !dd.classList.contains('open');
  dd.classList.toggle('open', opening);
  ov.classList.toggle('open', opening);
}
var langLabels = {'en': '🇺🇸 English', 'es': '🇪🇸 Español', 'pt': '🇧🇷 Português', 'de': '🇩🇪 Deutsch', 'nl': '🇳🇱 Nederlands', 'fr': '🇫🇷 Français', 'ar': '🇸🇦 العربية', 'zh-CN': '🇨🇳 中文 (简体)', 'ja': '🇯🇵 日本語', 'ko': '🇰🇷 한국어', 'ru': '🇷🇺 Русский', 'af': '🇿🇦 Afrikaans', 'am': '🇪🇹 አማርኛ', 'bn': '🇧🇩 বাংলা', 'zh-TW': '🇹🇼 中文 (繁體)', 'cs': '🇨🇿 Čeština', 'da': '🇩🇰 Dansk', 'fi': '🇫🇮 Suomi', 'el': '🇬🇷 Ελληνικά', 'iw': '🇮🇱 עברית', 'hi': '🇮🇳 हिन्दी', 'hu': '🇭🇺 Magyar', 'id': '🇮🇩 Bahasa Indonesia', 'it': '🇮🇹 Italiano', 'ms': '🇲🇾 Bahasa Melayu', 'no': '🇳🇴 Norsk', 'fa': '🇮🇷 فارسی', 'tl': '🇵🇭 Filipino', 'pl': '🇵🇱 Polski', 'ro': '🇷🇴 Română', 'sk': '🇸🇰 Slovenčina', 'sv': '🇸🇪 Svenska', 'sw': '🇰🇪 Kiswahili', 'th': '🇹🇭 ภาษาไทย', 'tr': '🇹🇷 Türkçe', 'uk': '🇺🇦 Українська', 'ur': '🇵🇰 اردو', 'vi': '🇻🇳 Tiếng Việt'};
function doTranslate(lang) {
  if (lang === '') return;
  // Update button label
  var btn = document.getElementById('translate-btn-label');
  if (btn && langLabels[lang]) btn.textContent = langLabels[lang];
  // If English selected, clear translation and reload
  if (lang === 'en') {
    // Set cookie to en|en (not just delete — Google re-reads the hash otherwise)
    document.cookie = 'googtrans=/en/en; path=/;';
    document.cookie = 'googtrans=/en/en; path=/; domain=' + location.hostname + ';';
    document.cookie = 'googtrans=/en/en; path=/; domain=.' + location.hostname + ';';
    // Strip any googtrans hash from URL then reload
    var clean = window.location.href
      .replace(/#googtrans\([^)]*\)/g, '')
      .replace(/#$/, '');
    window.location.replace(clean);
    return;
  }
  var sel = document.querySelector('.goog-te-combo');
  if (sel) {
    sel.value = lang;
    sel.dispatchEvent(new Event('change'));
  }
  closeTranslate();
}
document.addEventListener('click', function(e) {
  var dd = document.getElementById('translate-dropdown');
  if (dd && !dd.contains(e.target) && !e.target.classList.contains('translate-btn')) {
    closeTranslate();
  }
});
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
